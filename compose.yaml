x-app-environment: &app-environment
  DATABASE_URL: postgres://saga:saga@postgres:5432/saga
  UPLOAD_DIR: /data/uploads
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_API_KEY:-local-development-key}}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  GENERATION_API_KEY: ${GENERATION_API_KEY:-${OPENAI_API_KEY:-local-development-key}}
  GENERATION_BASE_URL: ${GENERATION_BASE_URL:-https://api.openai.com/v1}
  GENERATION_MODEL: ${GENERATION_MODEL:-gpt-5.4-mini}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: saga
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runtime
    command: ["node", "--enable-source-maps", "dist/infrastructure/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://saga:saga@postgres:5432/saga
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    command: ["node", "--enable-source-maps", "dist/api/main.js"]
    environment: *app-environment
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20
    init: true

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "--enable-source-maps", "dist/worker/main.js"]
    environment: *app-environment
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true

volumes:
  postgres-data:
  uploads:
